root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/gobot ./cmd/gobot/"
  bin = "./tmp/gobot"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "smoketest", "service"]
  exclude_file = ["projects.json", "sessions.json"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  log = "tmp/build-errors.log"

[log]
  time = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
